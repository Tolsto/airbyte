name: Snowflake WIF Final CI Diagnostics

on:
  push:
    branches: [automation/snowflake-wif-format-audit]

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('diagnostics', {recursive: true});
            const repo = {owner: 'airbytehq', repo: 'airbyte'};
            const sha = '5d60e567adf4fa539c3414cfa4fd6d8aaa56c35c';
            const save = (name, value) => fs.writeFileSync(`diagnostics/${name}`, typeof value === 'string' ? value : JSON.stringify(value, null, 2));
            for (const runId of [36199298754, 36199298713]) {
              let jobs;
              for (let attempt = 0; attempt < 32; attempt++) {
                const run = await github.rest.actions.getWorkflowRun({...repo, run_id: runId});
                if (run.data.head_sha !== sha) throw new Error('Unexpected workflow head');
                if (run.data.status === 'completed') {
                  jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id: runId, per_page: 100});
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
              if (!jobs) throw new Error(`Workflow ${runId} did not complete within diagnostic window`);
              save(`${runId}-jobs.json`, jobs.map(j => ({id: j.id, name: j.name, conclusion: j.conclusion, steps: j.steps})));
              for (const job of jobs.filter(j => j.conclusion === 'failure')) {
                try {
                  const result = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: job.id});
                  const text = typeof result.data === 'string' ? result.data : Buffer.from(result.data).toString('utf8');
                  const lines = text.split('\n');
                  const failureHeaders = lines.filter(l => / > .*FAILED/.test(l));
                  const missingFiles = [...new Set(lines.filter(l => /NoSuchFileException|FileNotFoundException/.test(l)).map(l => l.replace(/^\S+\s+/, '').trim()))];
                  save(`${job.id}-summary.json`, {
                    head_sha: sha,
                    name: job.name,
                    conclusion: job.conclusion,
                    failureHeaders,
                    missingFiles,
                    testCounts: lines.filter(l => /tests completed|tests,|BUILD SUCCESSFUL|BUILD FAILED/.test(l)),
                    specLines: lines.filter(l => /SnowflakeSpecTest|spec snapshot|semantic diff|generated spec/.test(l)),
                    credentialErrors: lines.filter(l => /GCP_PROD_DB_ACCESS_CREDENTIALS|environment variable is not set/.test(l)),
                  });
                  const selected = new Set();
                  for (let i = 0; i < lines.length; i++) {
                    if (/FAILED|FAILURE|Exception|Caused by|error|BUILD SUCCESSFUL|tests completed|SnowflakeSpecTest/i.test(lines[i])) {
                      for (let j = Math.max(0, i - 1); j <= Math.min(lines.length - 1, i + 3); j++) selected.add(j);
                    }
                  }
                  save(`${job.id}-diagnostic-lines.txt`, [...selected].sort((a,b) => a-b).map(i => `${i+1}: ${lines[i]}`).join('\n').slice(-200000));
                } catch (error) {
                  save(`${job.id}-error.txt`, `${error.status}: ${error.message}`);
                }
              }
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowflake-wif-final-ci-diagnostics
          path: diagnostics/
          retention-days: 1
