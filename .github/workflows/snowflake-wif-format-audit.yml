name: Snowflake WIF Spec Verification

on:
  push:
    branches: [automation/snowflake-wif-format-audit]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f89bcfefea9f1bd566ae81d3dfa5c805268d9a8c
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate snapshots with the real specification tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit
          ./gradlew --no-daemon --max-workers=2 --console=plain :airbyte-integrations:connectors:destination-snowflake:integrationTestJava --tests 'io.airbyte.integrations.destination.snowflake.spec.SnowflakeSpecTest' 2>&1 | tee audit/spec-generation.log
          result=${PIPESTATUS[0]}
          echo "Initial specification test exit code: $result"
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources')
          for name in ('expected-spec-oss.json', 'expected-spec-cloud.json'):
              spec = json.loads((root / name).read_text())
              credentials = spec['connectionSpecification']['properties']['credentials']['oneOf']
              assert len(credentials) == 3, (name, 'Expected existing auth variants plus WIF')
              wif = [c for c in credentials if 'workload_identity_provider' in c.get('properties', {})]
              assert len(wif) == 1, (name, 'Expected generated WIF schema')
              assert 'token_file_path' in wif[0]['properties']
              assert 'entra_resource' in wif[0]['properties']
          PY
          npx --yes prettier@3.0.3 --write airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources/expected-spec-{oss,cloud}.json
      - name: Verify unit tests and both regenerated snapshots
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --console=plain :airbyte-integrations:connectors:destination-snowflake:testJava :airbyte-integrations:connectors:destination-snowflake:integrationTestJava --tests 'io.airbyte.integrations.destination.snowflake.spec.SnowflakeSpecTest' 2>&1 | tee audit/verification.log
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('airbyte-integrations/connectors/destination-snowflake/build/test-results')
          files = list(root.glob('integrationTestJava/TEST-*SnowflakeSpecTest.xml'))
          assert len(files) == 1, 'Missing specification test report'
          suite = ET.parse(files[0]).getroot()
          assert int(suite.attrib['tests']) >= 2
          assert int(suite.attrib['failures']) == 0
          assert int(suite.attrib['errors']) == 0
          print(suite.attrib)
          PY
          npx --yes prettier@3.0.3 --check airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources/expected-spec-{oss,cloud}.json
      - name: Publish only the verified snapshots on an isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f89bcfefea9f1bd566ae81d3dfa5c805268d9a8c
          python3 - <<'PY'
          import subprocess
          expected = {
              'airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources/expected-spec-oss.json',
              'airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources/expected-spec-cloud.json',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git add -- airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources/expected-spec-{oss,cloud}.json
          git diff --cached --check
          git diff --cached > audit/snapshots.patch
          git -c user.name=Tolsto -c user.email=20240901+Tolsto@users.noreply.github.com commit -m 'fix(destination-snowflake): regenerate WIF specification snapshots'
          git rev-parse HEAD | tee audit/verified-commit.txt
          git push origin HEAD:refs/heads/automation/snowflake-wif-spec-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowflake-wif-spec-verification
          path: |
            audit/
            airbyte-integrations/connectors/destination-snowflake/build/test-results/**/*.xml
            airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources/expected-spec-*.json
          retention-days: 1
