name: Snowflake WIF Snapshot Publication

on:
  push:
    branches: [automation/snowflake-wif-format-audit]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f89bcfefea9f1bd566ae81d3dfa5c805268d9a8c
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: snowflake-wif-spec-verification
          run-id: 36198741119
          github-token: ${{ github.token }}
          path: /tmp/generated-specs
      - name: Validate and copy generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          prefix = Path('airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources')
          expected_hash = '930b3f8839f9ad2f3245ed4b24254b8dfb177753'
          for filename in ('expected-spec-oss.json', 'expected-spec-cloud.json'):
              path = prefix / filename
              data = (Path('/tmp/generated-specs') / path).read_bytes()
              actual_hash = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual_hash == expected_hash, (filename, actual_hash)
              old = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}']))
              new = json.loads(data)
              variants = new['connectionSpecification']['properties']['credentials']['oneOf']
              assert len(variants) == 3
              wif = variants.pop()
              assert wif['title'] == 'Workload Identity Federation'
              assert set(wif['properties']) == {'auth_type', 'workload_identity_provider', 'token_file_path', 'entra_resource'}
              old_variants = old['connectionSpecification']['properties']['credentials']['oneOf']
              assert variants[1]['description'] == old_variants[1]['description'].replace('key pair authentication instead.', 'key pair authentication or workload identity federation instead.')
              variants[1]['description'] = old_variants[1]['description']
              assert new == old, 'Unexpected changes outside the WIF credential schema'
              path.write_bytes(data)
          PY
          git diff --check
          git diff --stat
      - name: Publish a snapshots-only commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- airbyte-integrations/connectors/destination-snowflake/src/test-integration/resources/expected-spec-{oss,cloud}.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git -c user.name=Tolsto -c user.email=20240901+Tolsto@users.noreply.github.com commit -m 'fix(destination-snowflake): regenerate WIF specification snapshots'
          git rev-parse HEAD
          git push origin HEAD:refs/heads/automation/snowflake-wif-spec-output
