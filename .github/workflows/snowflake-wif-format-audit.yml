name: Snowflake WIF CI Diagnostics

on:
  push:
    branches: [automation/snowflake-wif-format-audit]

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('diagnostics', {recursive: true});
            const repo = {owner: 'airbytehq', repo: 'airbyte'};
            const save = (name, value) => fs.writeFileSync(`diagnostics/${name}`, typeof value === 'string' ? value : JSON.stringify(value, null, 2));
            for (const id of [108275360816, 108275273545]) {
              try {
                const result = await github.paginate(github.rest.checks.listAnnotations, {...repo, check_run_id: id, per_page: 100});
                save(`${id}-annotations.json`, result);
              } catch (error) {
                save(`${id}-annotations-error.txt`, `${error.status}: ${error.message}`);
              }
              try {
                const result = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: id});
                const text = typeof result.data === 'string' ? result.data : Buffer.from(result.data).toString('utf8');
                const lines = text.split('\n');
                const selected = new Set();
                for (let i = 0; i < lines.length; i++) {
                  if (/FAILED|FAILURE|Exception|Caused by|error|BUILD SUCCESSFUL|tests completed|secrets\//i.test(lines[i])) {
                    for (let j = Math.max(0, i - 2); j <= Math.min(lines.length - 1, i + 6); j++) selected.add(j);
                  }
                }
                const output = [...selected].sort((a, b) => a - b).map(i => `${i + 1}: ${lines[i]}`).join('\n');
                save(`${id}-diagnostic-lines.txt`, output.slice(-200000));
              } catch (error) {
                save(`${id}-logs-error.txt`, `${error.status}: ${error.message}`);
              }
            }
            try {
              const checks = await github.paginate(github.rest.checks.listForRef, {...repo, ref: 'ff20ab570075c4b1b52f5087a40045f7cf3b3b0d', per_page: 100});
              save('checks.json', checks.map(c => ({id: c.id, name: c.name, conclusion: c.conclusion, output: c.output})));
            } catch (error) {
              save('checks-error.txt', `${error.status}: ${error.message}`);
            }
            core.info(fs.readdirSync('diagnostics').join('\n'));
      - uses: actions/upload-artifact@v4
        with:
          name: snowflake-wif-ci-diagnostics
          path: diagnostics/
          retention-days: 1
